# 发布兜底：给每个 Release 自动补上「版本无关」的别名资产 WPAForge.apk
#
# 为什么需要它
#   网站 https://wlmosv.dpdns.org/dl 固定 302 到
#     https://github.com/wlmosv-png/wpaforge/releases/latest/download/WPAForge.apk
#   这个固定文件名只有在 Release 里真的挂了 WPAForge.apk 时才取得到。
#   历史事故：v1.9.50 只传了 WPAForge-v1.9.50-146.apk + sha256sum.txt，别名漏传
#   → releases/latest/download/WPAForge.apk 直接 404，站点下载按钮失效。
#   靠人记永远会漏，所以交给这个工作流。
#
# 行为（幂等）
#   Release 发布后自动把本版 APK 复制一份命名为 WPAForge.apk 一起挂上；
#   若别名已存在且 sha256 一致则跳过；不一致则覆盖。
#   最后当该 Release 就是 latest 时，实地校验固定直链返回 200，否则判失败。
#
# 手动补：Actions → release-alias → Run workflow，填 tag（如 v1.9.50）或留空用最新。
name: release-alias

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补别名的 tag（例如 v1.9.50）；留空 = 最新 Release"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-alias-${{ github.event.release.tag_name || inputs.tag || 'latest' }}

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 生成别名资产 WPAForge.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG="${{ inputs.tag }}"

          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          else
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          fi
          echo "目标 Release：$TAG"

          # 1) 等本版 APK 资产出现（有人习惯先 publish、再拖文件上去，最多等 10 分钟）
          SRC=""
          for i in $(seq 1 60); do
            ASSETS="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null || true)"
            SRC="$(printf '%s\n' "$ASSETS" | grep -E '\.apk$' | grep -vx 'WPAForge\.apk' | head -n1 || true)"
            if [ -n "$SRC" ]; then
              break
            fi
            echo "第 $i 次：还没看到 APK 资产，10 秒后重试"
            sleep 10
          done
          if [ -z "$SRC" ]; then
            echo "::error::Release $TAG 里没有 APK 资产，无法生成别名"
            exit 1
          fi
          echo "源资产：$SRC"

          # 2) 取源资产并算 sha256
          mkdir -p /tmp/alias /tmp/alias-old
          gh release download "$TAG" --repo "$REPO" --pattern "$SRC" --dir /tmp/alias
          SRC_SHA="$(sha256sum "/tmp/alias/$SRC" | awk '{print $1}')"
          cp "/tmp/alias/$SRC" /tmp/alias/WPAForge.apk
          echo "源 sha256：$SRC_SHA"

          # 3) 别名已存在且内容一致 → 无事可做
          if gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx 'WPAForge\.apk'; then
            gh release download "$TAG" --repo "$REPO" --pattern 'WPAForge.apk' --dir /tmp/alias-old --clobber
            OLD_SHA="$(sha256sum /tmp/alias-old/WPAForge.apk | awk '{print $1}')"
            if [ "$OLD_SHA" = "$SRC_SHA" ]; then
              echo "别名已存在且 sha256 一致，跳过上传"
              exit 0
            fi
            echo "别名存在但内容不一致（旧 $OLD_SHA），覆盖"
            gh release delete-asset "$TAG" 'WPAForge.apk' --repo "$REPO" --yes
          fi

          # 4) 上传别名
          gh release upload "$TAG" /tmp/alias/WPAForge.apk --repo "$REPO" --clobber

          # 5) 若这个 tag 就是 latest，实地校验站点用的固定直链
          LATEST="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          if [ "$LATEST" = "$TAG" ]; then
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "https://github.com/$REPO/releases/latest/download/WPAForge.apk")"
            echo "固定直链 HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::固定直链仍不可用（HTTP $CODE）"
              exit 1
            fi
          fi
          echo "完成：$TAG 的别名资产已就位"
